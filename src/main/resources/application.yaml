spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_api
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    naming:
      physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false

  flyway:
    enabled: true

api:
  security:
    token:
      secret: my-secret-key